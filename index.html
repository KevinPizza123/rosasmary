<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rose & Bloom | Floristería Boutique</title>
    <style>
        /* CSS TOTAL - ESTILO BOUTIQUE ELEGANTE */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Playfair Display', serif; }
        
        body { 
            background-color: #fff5f5; /* Rosa muy suave */
            color: #4a2c2c; 
            min-height: 100vh;
        }

        .container { max-width: 450px; margin: auto; padding: 20px; }

        /* HEADER */
        header { text-align: center; padding: 40px 0; }
        .logo { font-size: 35px; font-weight: 700; color: #d63384; letter-spacing: 2px; }
        .subtitle { font-family: 'Montserrat', sans-serif; font-size: 10px;  letter-spacing: 4px; color: #a38181; margin-top: 5px; }

        /* BANNER PRINCIPAL */
        .hero {
            width: 100%;
            height: 250px;
            background: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=400') center/cover;
            border-radius: 100px 100px 0 0; /* Forma de arco elegante */
            margin-bottom: 30px;
            box-shadow: 0 10px 20px rgba(214, 51, 132, 0.1);
        }

        /* SECCIÓN DE PRODUCTOS */
        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
        
        .product-card {
            background: white;
            padding: 10px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid #fce7f3;
            transition: 0.4s;
        }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px rgba(0,0,0,0.05); }
        .product-card img { width: 100%; border-radius: 10px; margin-bottom: 10px; }
        .product-card h3 { font-size: 16px; margin-bottom: 5px; }
        .price { color: #d63384; font-weight: bold; font-family: 'Montserrat', sans-serif; }

        /* BOTÓN DE COMPRA */
        .btn-order {
            width: 100%;
            padding: 15px;
            background: #d63384;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(214, 51, 132, 0.3);
            transition: 0.3s;
        }
        .btn-order:hover { background: #b0236a; letter-spacing: 1px; }

        /* MENSAJE ESPECIAL */
        .promo-box {
            background: #fff;
            border: 1px dashed #d63384;
            padding: 15px;
            margin: 25px 0;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
        }

        footer { text-align: center; padding: 20px; font-size: 12px; color: #a38181; font-family: 'Montserrat', sans-serif; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <header>
            <div class="logo">Rose & Bloom</div>
            <p class="subtitle">BOUTIQUE FLORAL</p>
        </header>

        <div class="hero"></div>

        <div class="promo-box">
            ✨ <strong>Envío gratis</strong> en tu primer ramo con el código: LOVE2026
        </div>

        <div class="product-grid">
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1561181286-d3fee7d55364?q=80&w=200" alt="Rosas Rojas">
                <h3>Amor Eterno</h3>
                <p class="price">$25.00</p>
            </div>
            <div class="product-card">
                <img src="https://png.pngtree.com/png-clipart/20241111/original/pngtree-three-white-roses-with-green-leaves-clipart-png-image_16899203.png" alt="Rosas Blancas">
                <h3>Pureza</h3>
                <p class="price">$30.00</p>
            </div>
        </div>

        <button class="btn-order" onclick="window.location.href='https://wa.me/593995864018?text=Hola,%20estoy%20interesado%20en%20comprar'">
    PEDIR POR WHATSAPP 🌸
</button>

        <footer>
            Entregas a domicilio de Lunes a Domingo<br>
            Quito, Ecuador
        </footer>
    </div>

</body>
</html>
